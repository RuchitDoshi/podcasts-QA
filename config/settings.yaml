# Pipeline-wide settings. Scripts read from here rather than hardcoding parameters.

whisper:
  model_size: "large-v3"     # use "base" or "small" for a fast local smoke test
  device: "cuda"              # "cpu" locally, "cuda" on Colab T4
  compute_type: "float16"       # int8 for CPU, float16 for GPU
  language: "en"
  vad_filter: true           # trims silence before transcription
  beam_size: 5                # lower to 1-2 for very long (3hr+) episodes if you
                               # hit OOM kills on Colab's free-tier system RAM cap
  max_chunk_seconds: 10800      # split audio longer than this (90 min) into chunks
                               # before transcribing, caps peak memory regardless
                               # of total episode length. Set to null to disable.

audio:
  sample_rate: 16000
  channels: 1                # mono

diarization:
  model: "pyannote/speaker-diarization-community-1"
  device: "cuda"              # "cuda" on the Linux GPU machine -- much faster there
  min_speakers: null          # set if you know the exact count for a given show format
  max_speakers: null

chunking:
  target_seconds: 60          # aim for ~60s of speech per chunk
  max_seconds: 90            # hard cap -- force a boundary even mid speaker-turn
  overlap_seconds: 5          # small overlap between consecutive chunks, helps
                               # retrieval when an answer straddles a chunk boundary

paths:
  raw_dir: "/home/ruchit/ruchit-personal/datasets/podcast-audio-wavs"
  transcripts_dir: "/home/ruchit/ruchit-personal/datasets/podcast-audio-transcripts"
  chunks_dir: "/home/ruchit/ruchit-personal/datasets/podcast-audio-chunks"
  chroma_dir: "/home/ruchit/ruchit-personal/datasets/chroma_db"

embeddings:
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cpu"

retrieval:
  top_k: 8
  dense_weight: 0.6
  bm25_weight: 0.4
  min_score_threshold: 0.64  # applied to RAW dense cosine similarity, not the
                              # fused score (fused/normalized scores are pool-
                              # relative and can't signal "nothing is relevant").
                              # bge-small often has a nonzero baseline similarity
                              # even for unrelated text -- treat 0.15 as a starting
                              # point and tune against eval/eval_retrieval.py
  use_reranker: true          # cross-encoder reranks the candidate pool before
                               # final top_k truncation -- local model, no API
                               # cost/rate limit. Disable via --no-rerank on
                               # retrieve/hybrid.py or eval_retrieval.py for A/B.
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  reranker_device: "cpu"
  fusion_method: "weighted"   # "weighted" (dense/bm25_weight, current validated
                               # baseline) or "rrf" (Reciprocal Rank Fusion --
                               # rank-based, magnitude-invariant, considered more
                               # robust in general but not yet A/B tested against
                               # this corpus's eval set). Override with
                               # --fusion-method on hybrid.py / eval_retrieval.py.
  rrf_k: 60                    # standard constant from the original RRF paper

llm:
  answer_model: "llama-3.3-70b-versatile"   # via Groq
  judge_model: "gemini-flash-latest"           # via Google AI Studio
