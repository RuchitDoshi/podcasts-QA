# Pipeline-wide settings. Scripts read from here rather than hardcoding parameters.

whisper:
  model_size: "large-v3"     # use "base" or "small" for a fast local smoke test
  device: "cpu"              # "cpu" locally, "cuda" on Colab T4
  compute_type: "int8"       # int8 for CPU, float16 for GPU
  language: "en"
  vad_filter: true           # trims silence before transcription

audio:
  sample_rate: 16000
  channels: 1                # mono

paths:
  raw_dir: "data/raw"
  transcripts_dir: "data/transcripts"
  chunks_dir: "data/chunks"
  chroma_dir: "chroma_db"

embeddings:
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cpu"

retrieval:
  top_k: 8
  dense_weight: 0.6
  bm25_weight: 0.4

llm:
  answer_model: "llama-3.3-70b-versatile"   # via Groq
  judge_model: "gemini-2.5-flash"           # via Google AI Studio
