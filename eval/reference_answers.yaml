  What does Kaldellis say about the fall of Constantinople?:
    reference_answer: 'Anthony Kaldellis discusses the fall of Constantinople in 1453 AD as the final
      collapse of the East Roman (Byzantine) Empire. However, he argues that the point of no return came
      much earlier, in the early 14th century, somewhere between 1300 and 1350, when "the sources of resilience
      begin to dry up."


      According to Kaldellis, several key factors led to this irreversible decline:


      1. **Loss of Asia Minor to the Turks by around 1300**: This was critical because it meant the empire
      could "no longer draw upon the two wings, as it were, the European side and the Asian side, which
      they could always do. They''re confined to Europe."


      2. **A series of civil wars, Serbian expansion, and the Black Death**: The empire "never recover[ed]
      from that."


      3. **Further territorial losses**: By the 1340s, the empire had been reduced to "a tiny little Balkan
      state" - essentially a ribbon-like corridor from Constantinople to the Adriatic. After a rebel made
      a deal with the Serbs and surrendered half that territory, Kaldellis says "game over."


      Kaldellis notes that what''s surprising is "it takes the Turks that long" - another century until
      1453. The Ottomans might have conquered Constantinople by 1400, but Timur (Tamerlane) came from
      Central Asia and "trounces the Turks, breaks up their empire," giving Constantinople another 50
      years.


      On the ultimate cause, Kaldellis is clear: "foreign invasions. There''s no question. It''s just
      invasions." He emphasizes that the empire coped with many invasions throughout its history, but
      eventually "all it takes is to lose to one and you lose some part of your territory. And if you
      keep losing enough, you won''t have anything to fall back on." He suggests that without significant
      external invasions, given the empire''s strong fundamentals in taxation, policy development, and
      political representation, "this empire could have lasted for another thousand years."'
