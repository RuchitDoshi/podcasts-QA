  What does Terence Tao say about using AI to solve hard math problems?:
    reference_answer: 'Terence Tao discusses several aspects of using AI to solve hard math problems:


      **Current Capabilities and Collaboration:**

      Tao notes that there are already math results that "could only have been accomplished because there
      was a human mathematician and an AI involved," though it''s hard to disentangle credit. He explains
      that AI tools "do not replicate all the skills needed to do mathematics but they can replicate some
      non-trivial percentage of them 30-40%." They can fill in gaps - for example, he mentions that coding
      in Python is annoying for him as a non-professional programmer, but "with AI the friction cost of
      doing it is much reduced."


      **AI''s Strengths:**

      AI excels at computational tasks and verification. Tao envisions AI being able to handle problems
      like "here''s a problem in partial differential equations could you solve it using any of the 20
      standard techniques" and trying all permutations. He also sees AI scaling well to attack "100 adjacent
      problems" once one problem is solved.


      **Key Limitations:**

      The main weakness Tao identifies is that AI "really struggles right now is knowing when it''s made
      a wrong turn." AI can propose approaches that are "complete nonsense but it looks like a proof."
      He notes that "AI generated proofs they can look superficially flawless" because reinforcement learning
      has trained them "to produce text that looks like what is correct." Unlike bad human proofs that
      make obvious mistakes, AI-generated proofs have subtle errors that are "really stupid like no human
      would have actually made that mistake."


      Tao describes trying to collaborate with AI on problems he already knows the solution to, where
      he has to "keep railroading it onto the path you want" because the AI will find arguments using
      different tools that "eventually goes into the weeds."


      **Future Vision:**

      Tao references a vision of future mathematics involving "a free form conversation where you don''t
      know in advance where things are going to go" with ideas and calculations proposed by both human
      and AI. He believes humans still excel at having a "metaphorical mathematical smell" - an intuition
      about whether proof strategies are viable - though he notes that systems like AlphaZero have developed
      similar intuition for chess and Go positions.'
