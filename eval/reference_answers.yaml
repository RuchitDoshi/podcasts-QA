  What does Dave Plummer say about programming and autism?:
    reference_answer: 'Dave Plummer discusses the connection between programming and autism in several
      ways:


      **Why many great programmers are on the spectrum:**

      When asked why so many excellent programmers and engineers are on the spectrum, Plummer explains
      that it''s due to "that single-minded focus and the ability to reduce a problem." He emphasizes
      the importance of being "ultimately curious about what''s inside stuff," which has been an obsession
      for him his whole life. He gives the example: "What''s inside? I''ve got to take my mom''s oven
      apart because I''ve got to know how the flip clock works." He believes this curiosity and willingness
      to get excited about details is "a good habit to have if you''re going to be a programmer."


      **The concept of being "a little bit autistic":**

      Plummer wrote about people who feel "a little bit autistic." He estimates that "maybe 10 to 20%
      of the population, is somewhere on the autism spectrum, but isn''t impacted by enough that it rises
      to the level of a disorder." These people still have many characteristics that arise from autism.
      He believes that if they can understand, identify, and manage these behaviors optimally, "they can
      both leverage them to take advantage of some of the skills and mediate some of the deficits and
      problems that come with it." He wrote about this primarily as "a little manual" for his kids, who
      don''t have ASD but have "certain aspects of my behavior that are particularly related to it."'
